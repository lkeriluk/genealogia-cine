<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genealogía del Cine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0d0d0d; color: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    text-align: center; padding: 48px 40px;
    background: #161616; border: 0.5px solid #2a2a2a;
    border-radius: 12px; width: 100%; max-width: 360px;
  }
  .app-title { font-size: 22px; font-weight: 500; margin-bottom: 8px; letter-spacing: -0.02em; }
  .app-sub { font-size: 13px; color: #888; margin-bottom: 40px; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 12px 20px;
    background: #fff; color: #333; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none;
    transition: background .15s;
  }
  .btn-google:hover { background: #f0f0f0; }
  .btn-google svg { flex-shrink: 0; }
  .footer { margin-top: 32px; font-size: 11px; color: #555; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-box">
  <div class="app-title">Genealogía del Cine</div>
  <div class="app-sub">Análisis de géneros cinematográficos</div>
  <a href="/auth/google" class="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18">
